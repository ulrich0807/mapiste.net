<div class="min-h-screen bg-gray-900 flex items-center justify-center relative overflow-hidden pt-24 pb-12 px-4">
  
  <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1920&q=80" class="absolute inset-0 w-full h-full object-cover opacity-20 transform scale-105" alt="Background">
  <div class="absolute inset-0 bg-gradient-to-b from-gray-900/60 to-gray-900/95"></div>

  <div class="relative z-10 w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/10 p-8 sm:p-10 rounded-[32px] shadow-2xl animate-fade-in-up">
    
    <a routerLink="/" class="inline-flex items-center text-sm font-medium text-gray-400 hover:text-orange-500 mb-8 transition-colors">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      Retour à l'accueil
    </a>

    <div class="flex bg-gray-900/50 rounded-2xl p-1 mb-8">
      <button (click)="isLoginMode = true" [ngClass]="isLoginMode ? 'bg-orange-500 text-white shadow-lg' : 'text-gray-400 hover:text-white'" class="flex-1 py-3 text-sm font-bold rounded-xl transition-all duration-300">Connexion</button>
      <button (click)="isLoginMode = false" [ngClass]="!isLoginMode ? 'bg-orange-500 text-white shadow-lg' : 'text-gray-400 hover:text-white'" class="flex-1 py-3 text-sm font-bold rounded-xl transition-all duration-300">Inscription</button>
    </div>

    <div *ngIf="successMessage" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 p-4 rounded-xl text-sm mb-6 flex items-start animate-fade-in-up">
      <svg class="w-5 h-5 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ successMessage }}
    </div>

    <div *ngIf="erreurMessage" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 p-4 rounded-xl text-sm mb-6 flex items-start animate-fade-in-up">
      <svg class="w-5 h-5 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      {{ erreurMessage }}
    </div>

    <!-- VUE LOGIN/REGISTER -->
    <form *ngIf="!isOtpMode" (submit)="onSubmit($event)" class="space-y-5">
      
      <div *ngIf="!isLoginMode" class="animate-fade-in-up">
        <label class="block text-sm font-medium text-gray-300 mb-2">Nom complet</label>
        <input type="text" name="nomComplet" [(ngModel)]="nomComplet" required placeholder="Ex: Amira Kouadio" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Adresse Email</label>
        <input type="email" name="email" [(ngModel)]="email" required placeholder="vous@exemple.ci" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Mot de passe</label>
        <input type="password" name="motDePasse" [(ngModel)]="motDePasse" required placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
      </div>

      <div *ngIf="isLoginMode" class="flex justify-end pt-1">
        <a routerLink="/mot-de-passe-oublie" class="text-xs font-medium text-gray-400 hover:text-orange-400 transition-colors">Mot de passe oublié ?</a>
      </div>

      <div class="pt-4">
        <button type="submit" [disabled]="chargement" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-tl-2xl rounded-br-2xl rounded-tr-md rounded-bl-md shadow-lg transition-transform transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed">
          {{ chargement ? 'Patientez...' : (isLoginMode ? 'Se connecter' : 'Créer mon compte') }}
        </button>
      </div>
    </form>

    <!-- VUE OTP -->
    <form *ngIf="isOtpMode" (submit)="verifyOtp($event)" class="space-y-5 animate-fade-in-up">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Code de vérification (6 chiffres)</label>
        <input type="text" name="otpCode" [(ngModel)]="otpCode" required maxlength="6" placeholder="000000" class="w-full text-center text-2xl tracking-[0.5em] font-bold bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
      </div>

      <div class="pt-4 space-y-3">
        <button type="submit" [disabled]="chargement" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-tl-2xl rounded-br-2xl rounded-tr-md rounded-bl-md shadow-lg transition-transform transform hover:scale-[1.02] disabled:opacity-50 disabled:cursor-not-allowed">
          {{ chargement ? 'Vérification...' : 'Valider mon compte' }}
        </button>
        <button type="button" (click)="resendOtp()" [disabled]="chargement" class="w-full bg-transparent hover:bg-white/5 border border-white/10 text-white font-medium py-3 rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Renvoyer le code
        </button>
      </div>
    </form>
  </div>
</div>
