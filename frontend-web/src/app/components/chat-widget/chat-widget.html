<div class="fixed bottom-6 right-6 z-[100] font-sans" *ngIf="userId">
  
  <!-- Floating Button -->
  <button (click)="toggleWidget()" class="bg-orange-500 hover:bg-orange-600 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center transition-transform hover:scale-110 relative">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
    <span *ngIf="unreadTotal > 0" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-black w-5 h-5 flex items-center justify-center rounded-full border-2 border-white">{{ unreadTotal }}</span>
  </button>

  <!-- Chat Panel -->
  <div *ngIf="isOpen" class="absolute bottom-20 right-0 w-[350px] h-[500px] bg-white rounded-2xl shadow-2xl border border-gray-100 flex flex-col overflow-hidden animate-fade-in-up">
    
    <!-- View 1: List of Conversations -->
    <ng-container *ngIf="view === 'list'">
      <div class="bg-gray-900 text-white p-4 flex justify-between items-center">
        <h3 class="font-bold text-lg">Vos Discussions</h3>
        <button (click)="toggleWidget()" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div class="flex-1 overflow-y-auto bg-[#f9fafb]">
        <div *ngIf="conversations.length === 0" class="p-6 text-center text-gray-500 text-sm">
          Vous n'avez aucune conversation.
        </div>
        
        <div *ngFor="let conv of conversations" (click)="openChat(conv)" class="p-4 border-b border-gray-100 flex items-center gap-3 cursor-pointer hover:bg-white transition-colors">
          <div class="relative">
            <img [src]="conv.interlocuteur.avatar || 'https://ui-avatars.com/api/?name=' + conv.interlocuteur.name + '&background=random'" class="w-10 h-10 rounded-full object-cover">
            <span *ngIf="conv.non_lus > 0" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full border border-white">{{ conv.non_lus }}</span>
          </div>
          <div class="flex-1 overflow-hidden">
            <div class="flex justify-between items-center mb-1">
              <h4 class="font-bold text-gray-900 text-sm truncate">{{ conv.interlocuteur.name }}</h4>
              <span class="text-[10px] text-gray-400">{{ conv.date | date:'HH:mm' }}</span>
            </div>
            <p class="text-xs text-gray-500 truncate">{{ conv.dernier_message }}</p>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- View 2: Active Chat -->
    <ng-container *ngIf="view === 'chat' && selectedContact">
      <div class="bg-gray-900 text-white p-3 flex items-center gap-3">
        <button (click)="backToList()" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <img [src]="selectedContact.interlocuteur.avatar || 'https://ui-avatars.com/api/?name=' + selectedContact.interlocuteur.name + '&background=random'" class="w-8 h-8 rounded-full object-cover">
        <h3 class="font-bold text-sm truncate flex-1">{{ selectedContact.interlocuteur.name }}</h3>
        <button (click)="toggleWidget()" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div id="widget-chat-messages" class="flex-1 overflow-y-auto p-4 bg-[#f4f7f6] flex flex-col gap-3">
        <div *ngFor="let msg of messages" class="flex flex-col w-full" [ngClass]="msg.sender_id === userId ? 'items-end' : 'items-start'">
          <div class="max-w-[80%] p-2.5 rounded-2xl text-sm" [ngClass]="msg.sender_id === userId ? 'bg-orange-500 text-white rounded-br-none' : 'bg-white text-gray-900 rounded-bl-none shadow-sm border border-gray-100'">
            {{ msg.contenu }}
          </div>
          <span class="text-[9px] text-gray-400 mt-1 mx-1">{{ msg.created_at | date:'HH:mm' }}</span>
        </div>
      </div>

      <div class="p-3 bg-white border-t border-gray-100 flex gap-2">
        <input type="text" [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" placeholder="Votre message..." class="flex-1 bg-gray-50 border border-gray-200 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-orange-500 transition-colors">
        <button (click)="sendMessage()" [disabled]="!newMessage.trim()" class="bg-orange-500 hover:bg-orange-600 disabled:bg-gray-300 text-white rounded-full w-10 h-10 flex items-center justify-center transition-colors shrink-0">
          <svg class="w-4 h-4 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
        </button>
      </div>
    </ng-container>

  </div>
</div>
